stages:
  - backup

variables:
  BACKUP_DIR: backup
  REAL_BACKUP_DIR: /Volumes/acasis/backup
  CONTAINER_NAME: gitlab-ce

backup_gitlab_container:
  stage: backup
  tags:
    - backup

  script:
    - echo "Test Docker："
    - docker run --rm hello-world
    - echo "列出所有容器："
    - docker ps -a
    - echo "开始备份容器 ${CONTAINER_NAME} ..."
    - mkdir -p "${BACKUP_DIR}"
    - TIMESTAMP="$(date +'%Y%m%d%H%M')"
    - docker export "${CONTAINER_NAME}" > "${BACKUP_DIR}/${CONTAINER_NAME}_backup_${TIMESTAMP}.tar"
    - cp "${BACKUP_DIR}/${CONTAINER_NAME}_backup_${TIMESTAMP}.tar" "${REAL_BACKUP_DIR}/${CONTAINER_NAME}_backup_${TIMESTAMP}.tar"
    - rm -f "${BACKUP_DIR}/${CONTAINER_NAME}_backup_${TIMESTAMP}.tar"
    - echo "备份完成：${BACKUP_DIR}/${CONTAINER_NAME}_backup_${TIMESTAMP}.tar"
    - echo "本地硬盘备份路径：${REAL_BACKUP_DIR}/${CONTAINER_NAME}_backup_${TIMESTAMP}.tar"

  only:
    - schedules