input {
  beats {
    port => 5044
  }
}

# 动态路由到不同管道
filter {
  if [log_type] == "jmeter" {
    # 添加管道标识元数据
    mutate { add_field => { "[@metadata][target_pipeline]" => "output_elasticsearch" } }
  } else if [log_type] == "smarthome" {
    # 添加管道标识元数据
    mutate { add_field => { "[@metadata][target_pipeline]" => "output_pg" } }
  } else {
    # 如果都不匹配，默认发送到 output_elasticsearch
    mutate { add_field => { "[@metadata][target_pipeline]" => "output_elasticsearch" } }
  }


}

output {
  if [log_type] == "jmeter" {
    pipeline {
      send_to => [ "output_elasticsearch" ]
    }
  } else if [log_type] == "smarthome" {
    pipeline {
      #send_to => [ "output_pg" ]
    }
  } else {
    # 如果没有匹配，则默认发到某个管道
    pipeline {
      send_to => [ "output_elasticsearch" ]
    }
  }

}