# 从管道接收数据
input {
  pipeline {
    address => "output_pg"  # 必须与send_to名称一致
  }
}

filter {
  grok {
    match => { "message" => "^%{NUMBER:unix_zeit:int}%{SPACE}%{NUMBER:millisekunde:int}%{SPACE}%{NUMBER:sensorid:int}%{SPACE}%{WORD:datentypid}%{SPACE}(?<messwert>.+)$" }
    overwrite => ["message"]
  }

  # 时间戳转换（精确到毫秒）
  ruby {
    code => '
      unix_time = event.get("unix_zeit").to_f
      milliseconds = event.get("millisekunde").to_f / 1000.0
      event.set("timestamp", Time.at(unix_time + milliseconds).utc.strftime("%Y-%m-%d %H:%M:%S.%3N"))
    '
  }

  # 统一处理 messwert 字段
  mutate {
    convert => { "messwert" => "string"
      "unix_zeit" => "integer"
      "millisekunde" => "integer"
      "sensorid" => "integer"
    }
  }
  # 截断处理（确保不超过255字符）
  truncate {
    fields => ["messwert"]
    length_bytes => 255  # 按字节计算（中文需注意）
  }

  # 移除不需要的字段
  mutate {
    remove_field => ["@version", "@timestamp", "host", "message", "path"]
  }
}

output {
  jdbc {
    connection_string => "jdbc:postgresql://host.docker.internal:5432/smarthome"
    username => "taoting"
    password => "0000"
    driver_class => "org.postgresql.Driver"
    driver_jar_path => "/usr/share/logstash/vendor/jar/jdbc/postgresql-42.7.4.jar"

    statement => [
      "INSERT INTO sensormesswert (unix_zeit, millisekunde, sensorid, datentypid, messwert, timestamp) VALUES (CAST(? AS BIGINT),CAST(? AS INTEGER), CAST(? AS INTEGER), ?, ?, CAST(? AS TIMESTAMP))",
      "%{unix_zeit}",
      "%{millisekunde}",
      "%{sensorid}",
      "%{datentypid}",
      "%{messwert}",
      "%{timestamp}"
    ]

    # 性能优化参数
    flush_size => 1000
  }

   stdout {
    codec => rubydebug {
      metadata => true
    }
  }
}