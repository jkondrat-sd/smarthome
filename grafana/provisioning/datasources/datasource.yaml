apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    # 如果设置了用户名密码，则在此填写
    # basicAuth: true
    # basicAuthUser: elastic
    # basicAuthPassword: elastic_password
    isDefault: true
    jsonData:
      timeField: "@timestamp"
      esVersion: 7
      logMessageField: "message"
      maxConcurrentShardRequests: 256
    version: 1
    editable: true

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      timeField: "time"
    version: 1
    editable: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: host.docker.internal:5432
    database: "smarthome"
    user: taoting
    password: 0000
    isDefault: false
    jsonData:
      sslmode: "disable"
    editable: true



